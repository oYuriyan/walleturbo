name: Validação técnica
on: [push, pull_request]
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Construir ambiente de testes
        run: docker build --target test -t walleturbo-test .
      - name: Executar testes em container
        run: docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges walleturbo-test
      - name: Auditar dependências
        run: docker run --rm --tmpfs /tmp --entrypoint pip-audit walleturbo-test --cache-dir /tmp/pip-audit --disable-pip --no-deps -r requirements.lock
      - name: Validar JavaScript
        run: |
          node --check web/app.js
          node --check web/cards.js
          node --check web/pdf.js
      - name: Validar PostgreSQL e Redis reais em volume novo
        run: |
          cp .env.example .env
          docker compose up --build -d --wait --wait-timeout 120
          docker compose exec -T -e SMOKE_BASE_URL=http://localhost:8000 api python < tests/integration_real.py
          docker compose exec -T -e WALLETURBO_INTEGRATION=1 -e SMOKE_BASE_URL=http://localhost:8000 api python < tests/integration_cards.py
          docker compose exec -T -e WALLETURBO_INTEGRATION=1 api python < tests/integration_migrations.py
          docker compose exec -T -e WALLETURBO_INTEGRATION=1 -e SMOKE_BASE_URL=http://localhost:8000 api python < tests/integration_pdf.py
          test "$(docker inspect --format '{{.HostConfig.NetworkMode}}' "$(docker compose ps -q parser)")" = "none"
      - name: Validar revisão de PDF no navegador
        run: |
          mkdir -p artifacts
          docker compose exec -T api python -c "import sys; g={'__name__':'fixture'}; exec(compile(sys.stdin.read(),'fixture','exec'),g); sys.stdout.buffer.write(g['make_pdf'](['03/11/2026 Mercado 123,45','2026-11-04 Estorno loja -23,45']))" < tests/integration_pdf.py > artifacts/fatura-sintetica.pdf
          npm install --prefix /tmp/walleturbo-e2e playwright@1.58.2
          /tmp/walleturbo-e2e/node_modules/.bin/playwright install --with-deps chromium
          docker compose exec -T -e WALLETURBO_INTEGRATION=1 api python < tests/browser_seed.py | PLAYWRIGHT_MODULE=/tmp/walleturbo-e2e/node_modules/playwright node tests/browser_pdf.cjs
      - name: Salvar evidências sintéticas de interface
        uses: actions/upload-artifact@v4
        with:
          name: revisao-pdf
          path: artifacts/pdf-*.png
      - name: Encerrar serviços de teste
        if: always()
        run: docker compose down
