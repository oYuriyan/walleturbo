name: Validação técnica
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: validacao-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  testes:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node.js 24
      - name: Construir ambiente de testes
        run: docker build --target test -t walleturbo-test .
      - name: Executar testes em container
        run: docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges walleturbo-test
      - name: Auditar dependências
        run: docker run --rm --tmpfs /tmp --entrypoint pip-audit walleturbo-test --cache-dir /tmp/pip-audit --disable-pip --no-deps -r requirements.lock
      - name: Validar JavaScript
        run: |
          node --check web/app.js
          node --check web/cards.js
          node --check web/pdf.js
          node --check web/planning.js
          node --check web/balances.js
          node --check web/lifecycle.js
          node --check web/history.js
          node --check web/corrections.js
          node --check web/payment-corrections.js
          node --check web/ofx-relocation.js
      - name: Validar PostgreSQL e Redis reais em volume novo
        run: |
          cp .env.example .env
          docker compose up --build -d --wait --wait-timeout 120
          docker compose exec -T -e SMOKE_BASE_URL=http://localhost:8000 api python < tests/integration_real.py
          docker compose exec -T -e WALLETURBO_INTEGRATION=1 -e SMOKE_BASE_URL=http://localhost:8000 api python < tests/integration_cards.py
          docker compose exec -T -e WALLETURBO_INTEGRATION=1 -e SMOKE_BASE_URL=http://localhost:8000 api python < tests/integration_balances.py
          docker compose exec -T -e WALLETURBO_INTEGRATION=1 api python < tests/integration_migrations.py
          docker compose exec -T -e WALLETURBO_INTEGRATION=1 -e SMOKE_BASE_URL=http://localhost:8000 api python < tests/integration_pdf.py
          test "$(docker inspect --format '{{.HostConfig.NetworkMode}}' "$(docker compose ps -q parser)")" = "none"
      - name: Validar revisão de PDF no navegador
        run: |
          mkdir -p artifacts
          docker compose exec -T api python -c "import sys; g={'__name__':'fixture'}; exec(compile(sys.stdin.read(),'fixture','exec'),g); sys.stdout.buffer.write(g['make_pdf'](['03/11/2026 Mercado 123,45','2026-11-04 Estorno loja -23,45']))" < tests/integration_pdf.py > artifacts/fatura-sintetica.pdf
          docker compose exec -T api python -c "import sys; g={'__name__':'fixture'}; exec(compile(sys.stdin.read(),'fixture','exec'),g); sys.stdout.buffer.write(g['make_pdf'](['03/11/2026 Mercado em outro documento 123,45']))" < tests/integration_pdf.py > artifacts/fatura-conciliacao-sintetica.pdf
          # Ubuntu 24.04 já fornece as bibliotecas dos motores; evitar fontes extras via APT.
          npm install --prefix /tmp/walleturbo-e2e playwright@1.58.2 axe-core@4.10.3
          /tmp/walleturbo-e2e/node_modules/.bin/playwright install chromium firefox
          docker compose exec -T -e WALLETURBO_INTEGRATION=1 api python < tests/browser_seed.py | PLAYWRIGHT_MODULE=/tmp/walleturbo-e2e/node_modules/playwright node tests/browser_pdf.cjs
      - name: Validar planejamento no navegador
        run: |
          docker compose exec -T -e WALLETURBO_INTEGRATION=1 api python < tests/browser_seed.py | PLAYWRIGHT_MODULE=/tmp/walleturbo-e2e/node_modules/playwright node tests/browser_planning.cjs
      - name: Validar saldos e transferências no navegador
        run: |
          docker compose exec -T -e WALLETURBO_INTEGRATION=1 api python < tests/browser_seed.py | PLAYWRIGHT_MODULE=/tmp/walleturbo-e2e/node_modules/playwright node tests/browser_balances.cjs
      - name: Validar login real e jornada financeira básica
        run: |
          python scripts/setup_auth.py
          docker compose --env-file .env --env-file .env.auth -f compose.yaml -f compose.auth.yaml up --build -d --wait --wait-timeout 240
          docker compose exec -T api python -c "import asyncio; from app.main import oauth, conf; data=asyncio.run(oauth.identity.load_server_metadata()); assert data['issuer'] == conf.oidc_issuer; print('PASS: descoberta OIDC real e issuer consistente')"
          set -a
          source .env.auth
          set +a
          docker compose exec -T -e WALLETURBO_INTEGRATION=1 -e KEYCLOAK_ADMIN_USER -e KEYCLOAK_ADMIN_PASSWORD api python < tests/seed_oidc.py | RECOVERY_TEST=1 PLAYWRIGHT_MODULE=/tmp/walleturbo-e2e/node_modules/playwright node tests/browser_oidc.cjs
      - name: Validar ciclo de vida dos cadastros
        run: |
          # Nova janela após a jornada ampliada, mantendo as cotas reais.
          sleep 60
          docker compose exec -T -e WALLETURBO_INTEGRATION=1 -e SMOKE_BASE_URL=http://localhost:8000 api python < tests/integration_lifecycle.py
          docker compose exec -T -e WALLETURBO_INTEGRATION=1 api python < tests/browser_seed.py | PLAYWRIGHT_MODULE=/tmp/walleturbo-e2e/node_modules/playwright node tests/browser_lifecycle.cjs
      - name: Validar ciclo de vida de metas no navegador
        run: |
          # Respeitar a janela de 120 requisições/IP sem relaxar os limites da aplicação.
          sleep 60
          docker compose exec -T -e WALLETURBO_INTEGRATION=1 api python < tests/browser_seed.py | PLAYWRIGHT_MODULE=/tmp/walleturbo-e2e/node_modules/playwright node tests/browser_goals.cjs
      - name: Validar correção integral de compras no navegador
        run: |
          docker compose exec -T -e WALLETURBO_INTEGRATION=1 api python < tests/browser_seed.py | PLAYWRIGHT_MODULE=/tmp/walleturbo-e2e/node_modules/playwright node tests/browser_corrections.cjs
      - name: Validar correção de pagamentos no PostgreSQL e navegador
        run: |
          # Nova janela de cotas por IP, sem desabilitar os limites da aplicação.
          sleep 60
          docker compose exec -T -e WALLETURBO_INTEGRATION=1 -e SMOKE_BASE_URL=http://localhost:8000 api python < tests/integration_payment_corrections.py
          docker compose exec -T -e WALLETURBO_INTEGRATION=1 -e SMOKE_BASE_URL=http://localhost:8000 api python < tests/integration_planning_versions.py
          docker compose exec -T -e WALLETURBO_INTEGRATION=1 api python < tests/browser_seed.py | PLAYWRIGHT_MODULE=/tmp/walleturbo-e2e/node_modules/playwright node tests/browser_payment_corrections.cjs
      - name: Validar lançamentos e origens de importação
        run: |
          # Preservar as cotas por IP e importação com uma nova janela de teste.
          sleep 60
          docker compose exec -T -e WALLETURBO_INTEGRATION=1 -e SMOKE_BASE_URL=http://localhost:8000 api python < tests/integration_entry_import_integrity.py
          docker compose exec -T -e WALLETURBO_INTEGRATION=1 api python < tests/browser_seed.py | PLAYWRIGHT_MODULE=/tmp/walleturbo-e2e/node_modules/playwright node tests/browser_entry_import_integrity.cjs
      - name: Validar cartões e demonstração com segurança de conteúdo
        run: |
          sleep 60
          docker compose exec -T -e WALLETURBO_INTEGRATION=1 api python < tests/browser_seed.py | PLAYWRIGHT_MODULE=/tmp/walleturbo-e2e/node_modules/playwright node tests/browser_cards.cjs
          PLAYWRIGHT_MODULE=/tmp/walleturbo-e2e/node_modules/playwright node tests/browser.cjs
          docker compose exec -T -e WALLETURBO_INTEGRATION=1 api python < tests/browser_seed.py | PLAYWRIGHT_MODULE=/tmp/walleturbo-e2e/node_modules/playwright node tests/browser_first_steps.cjs
      - name: Validar interface e acessibilidade em Chromium e Firefox
        run: |
          # A jornada autenticada usa uma janela própria, mantendo as cotas reais.
          sleep 60
          PLAYWRIGHT_MODULE=/tmp/walleturbo-e2e/node_modules/playwright AXE_PATH=/tmp/walleturbo-e2e/node_modules/axe-core/axe.min.js node tests/browser_ui.cjs
          docker compose exec -T -e WALLETURBO_INTEGRATION=1 api python < tests/browser_seed.py | BROWSER_ENGINE=firefox UI_AUTH=1 PLAYWRIGHT_MODULE=/tmp/walleturbo-e2e/node_modules/playwright AXE_PATH=/tmp/walleturbo-e2e/node_modules/axe-core/axe.min.js node tests/browser_ui.cjs
      - name: Validar OFX no PostgreSQL e navegador
        run: |
          sleep 60
          for ofx_fixture in bank-102.ofx bank-220.ofx; do
            docker compose exec -T api sh -c "cat > /tmp/$ofx_fixture" < "tests/fixtures/ofx/$ofx_fixture"
          done
          docker compose exec -T -e WALLETURBO_INTEGRATION=1 -e SMOKE_BASE_URL=http://localhost:8000 api python < tests/integration_ofx.py
          docker compose exec -T -e WALLETURBO_INTEGRATION=1 api python < tests/browser_seed.py | PLAYWRIGHT_MODULE=/tmp/walleturbo-e2e/node_modules/playwright node tests/browser_ofx.cjs
      - name: Validar OFX de cartão no PostgreSQL e navegador
        run: |
          sleep 60
          for ofx_fixture in card-102.ofx card-220.ofx; do
            docker compose exec -T api sh -c "cat > /tmp/$ofx_fixture" < "tests/fixtures/ofx/$ofx_fixture"
          done
          docker compose exec -T -e WALLETURBO_INTEGRATION=1 -e SMOKE_BASE_URL=http://localhost:8000 api python < tests/integration_ofx_card.py
          docker compose exec -T -e WALLETURBO_INTEGRATION=1 -e SMOKE_BASE_URL=http://localhost:8000 api python < tests/integration_ofx_relocation.py
          docker compose exec -T -e WALLETURBO_INTEGRATION=1 api python < tests/browser_seed.py | PLAYWRIGHT_MODULE=/tmp/walleturbo-e2e/node_modules/playwright node tests/browser_ofx_card.cjs
          docker compose exec -T -e WALLETURBO_INTEGRATION=1 api python < tests/browser_seed.py | PLAYWRIGHT_MODULE=/tmp/walleturbo-e2e/node_modules/playwright node tests/browser_ofx_relocation.cjs
      - name: Validar volume básico local e navegação mobile
        run: |
          sleep 60
          mkdir -p artifacts
          docker compose exec -T -e WALLETURBO_INTEGRATION=1 -e VOLUME_BROWSER=1 api python < tests/integration_volume.py | PLAYWRIGHT_MODULE=/tmp/walleturbo-e2e/node_modules/playwright node tests/browser_volume.cjs
      - name: Salvar evidências sintéticas de interface
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node.js 24
        with:
          name: revisao-pdf
          if-no-files-found: warn
          retention-days: 7
          path: |
            artifacts/pdf-*.png
            artifacts/ofx-*.png
            artifacts/planning-*.png
            artifacts/balances-*.png
            artifacts/first-steps-*.png
            artifacts/ui-*.png
            artifacts/volume-mobile.png
            artifacts/v1-volume.json
            artifacts/lifecycle-*.png
            artifacts/goals-*.png
            artifacts/history-*.png
            artifacts/corrections-*.png
            artifacts/payment-corrections-*.png
            artifacts/entry-import-*.png
            artifacts/import-correction-*.png
            artifacts/cards-*.png
            artifacts/desktop.png
            artifacts/mobile*.png
      - name: Encerrar serviços de teste
        if: always()
        run: |
          if [ -f .env.auth ]; then
            docker compose --env-file .env --env-file .env.auth -f compose.yaml -f compose.auth.yaml down
          else
            docker compose down
          fi
