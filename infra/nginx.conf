# Exemplo de borda para a futura composição de produção.
# TLS, DNS e certificado devem ser configurados no ingress real.
limit_req_zone $binary_remote_addr zone=walleturbo:10m rate=5r/s;
server {
    listen 8080;
    server_tokens off;
    client_max_body_size 300k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    location / {
        limit_req zone=walleturbo burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For "";
        proxy_read_timeout 30s;
    }
}
