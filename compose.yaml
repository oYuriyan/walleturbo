services:
  api:
    image: walleturbo-api
    build:
      context: .
      target: base
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - parser_socket:/run/walleturbo-parser:ro
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      parser: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1
    restart: unless-stopped
  parser:
    build:
      context: .
      target: parser
    network_mode: none
    volumes:
      - parser_socket:/run/walleturbo-parser
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 16
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: [CMD, python, -c, "import socket; s=socket.socket(socket.AF_UNIX); s.settimeout(2); s.connect('/run/walleturbo-parser/pdf.sock'); s.close()"]
      interval: 5s
      retries: 12
    restart: unless-stopped
  migrate:
    image: walleturbo-api
    build:
      context: .
      target: base
    env_file: .env
    command: [python, -m, app.migrate]
    depends_on:
      db: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: walleturbo
      POSTGRES_USER: walleturbo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U walleturbo -d walleturbo"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: [redis-server, --save, "", --appendonly, "no", --maxmemory, 128mb, --maxmemory-policy, noeviction]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 10
    restart: unless-stopped
  tests:
    profiles: [test]
    build:
      context: .
      target: test
    environment:
      DATABASE_URL: sqlite://
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
volumes:
  postgres_data:
  parser_socket:
